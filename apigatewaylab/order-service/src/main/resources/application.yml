server:
  port: 8082
spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/order_db}
    username: ${DB_USERNAME:order_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
lab:
  jwt:
    secret: ${JWT_SECRET}
    issuer: apigatewaylab
    lifetime-seconds: 3600
  internal-token: ${INTERNAL_API_TOKEN}
